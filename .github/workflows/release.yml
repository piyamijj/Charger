name: Android build and release
on:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure version and signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo 'Tag must be vMAJOR.MINOR.PATCH'; exit 1; fi
          major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          if (( major > 2000 || minor > 999 || patch > 999 )); then echo 'Version component too large'; exit 1; fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code == 0 )); then echo 'Version code must be positive'; exit 1; fi
          echo "VERSION_NAME=$tag" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aura-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/aura-release.jks" >> "$GITHUB_ENV"
            echo 'SIGNING_KIND=release-signed' >> "$GITHUB_ENV"
          elif [[ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo 'SIGNING_KIND=debug-signed' >> "$GITHUB_ENV"
          else
            echo 'Set all four signing secrets or none of them.'; exit 1
          fi
      - name: Build release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Name artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AuraCharge-${VERSION_NAME}-${SIGNING_KIND}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "AuraCharge-${VERSION_NAME}-${SIGNING_KIND}.aab"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AuraCharge-*.apk
            AuraCharge-*.aab
